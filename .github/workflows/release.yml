name: Build JixOne Desktop

# Every push builds all three platforms. A manual run with a version
# publishes those builds as release v<version>.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Publish as a release (e.g. 1.0.0). Empty = build only.'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc -p .
      - run: npm run build
      - name: Package
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: jixone-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error

  release:
    if: inputs.release_version != ''
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Check the version matches package.json
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.release_version }}"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.release_version }}
          target_commitish: ${{ github.sha }}
          name: JixOne Desktop ${{ inputs.release_version }}
          body_path: RELEASE-NOTES.md
          files: out/*
